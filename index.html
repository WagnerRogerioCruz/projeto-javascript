<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Tech Dash</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="tabela.css">
</head>
<body>
    
    <!-- CONTROLE DE MODO -->
    <div class="top-bar">
        <label>Modo:</label>
        <select id="modo">
            <option value="professor">Professor</option>
            <option value="aluno">Aluno</option>
        </select>
    </div>

    <div class="container">
        
        <!-- 1. FORMULÁRIO -->
        <div class="formulario">
            <h1>Cadastro de estudantes</h1>
            <!-- Área de cadastro -->
            <form class="section-cadastro" id="formCadastro">
                <h2>Dados do Aluno</h2>
                <input type="text" id="nomeAluno" placeholder="Nome do aluno"/>
                <input type="text" id="nomeResponsavel" placeholder="Nome do responsavel" />
                <input type="tel" id="telefoneResponsavel" placeholder="Telefone do responsável" />
                <input type="email" id="emailResponsavel" placeholder="E-mail do responsável" />

                <label for="nota1">Nota da 1ª prova: </label>
                <input type="number" id="nota1" placeholder="0.0" />
                
                <label for="nota2">Nota da 2ª prova: </label>
                <input type="number" id="nota2" placeholder="0.0" />
                
                <label for="nota3">Nota da 3ª prova: </label>
                <input type="number" id="nota3" placeholder="0.0" />
                
                <label for="presenca">Total de presença: </label>
                <input type="number" id="aulasPresente" placeholder="0.0" />

                <label for="aulasTotais">Total de aulas: </label>
                <input type="number" id="aulasTotais" placeholder="0.0" />
                
                <button type="submit">Cadastrar Estudante</button>
            </form>
        </div>

         <!-- 2. PAINEL -->
        <div class="painel">

            <input type="text" id="busca" placeholder="Buscar aluno..." />

            <table id="tabela">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>Média</th>
                        <th>Frequência</th>
                        <th>Status</th>
                        <th>Conceito</th>
                        <th>E-mail</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
            </table>
        </div>

        <!-- 3. GAMIFICAÇÃO -->
        <div class="gamificacao">
            <h2>Central de Desafios 🎮</h2>

            <button onclick="adivinhar()">🔮 Adivinhação</button>
            <button onclick="rolarDados()">🎲 Rolar Dados</button>

            <p id="alunoSelecionadoInfo">Nenhum aluno selecionado</p>
        </div>

    </div>

    <div id="popup" class="popup"></div>

</body>
<script src="logica.js"></script>
<script src="interface.js"></script>

</html>
